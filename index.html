<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Notes Maker — Core Stable</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Telugu:wght@400;500;600;700&family=Noto+Serif+Telugu:wght@400;600;700&display=swap');
*{box-sizing:border-box}body{margin:0;background:#edf0f4;color:#202124;font-family:Arial,sans-serif}
.toolbar{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid #d0d5dc;padding:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
button,select{border:1px solid #c9ced6;background:#fff;border-radius:5px;padding:6px 9px;cursor:pointer}
button:hover{background:#eef4ff}.title{font-weight:700;margin-right:8px}
.layout{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:14px;max-width:1700px;margin:auto}
.panel{background:#fff;border:1px solid #cdd2d9;border-radius:8px;overflow:hidden}
.head{padding:10px 13px;border-bottom:1px solid #ddd;font-weight:700}
.area{padding:18px;background:#f3f4f6;overflow:auto;min-height:calc(100vh - 100px)}
.paper{width:794px;min-height:1123px;margin:auto;background:#fff;padding:72px;box-shadow:0 2px 12px #0002}
#editor{font-family:'Noto Sans Telugu',Arial,sans-serif;font-size:16px;line-height:1.55;min-height:300px;outline:none;overflow-wrap:anywhere}
#editor:empty:before{content:'Type your notes here… / మీ నోట్స్ ఇక్కడ టైప్ చేయండి…';color:#aaa}
.block{margin:0 0 12px}.imgBlock{text-align:center;margin:18px 0}.imgBlock img{max-width:100%;height:auto;display:inline-block;cursor:pointer}.imgBlock img.selected{outline:3px solid #3478df;outline-offset:3px}
#preview{width:794px;min-height:1123px;margin:auto;background:#fff;padding:40px;font-family:'Noto Sans Telugu',Arial,sans-serif;font-size:16px;line-height:1.55;box-shadow:0 2px 12px #0001;overflow-wrap:anywhere}
#preview .imgBlock{margin:18px 0;text-align:center}#preview img{max-width:100%;height:auto;display:inline-block}
.msg{font-size:12px;color:#666;margin-left:auto}
.imgTools{display:flex;align-items:center;gap:4px;padding:3px 5px;border:1px solid #d6dae1;border-radius:6px;background:#f7f8fa}.imgToolsTitle{font-size:12px;font-weight:700;color:#555}.imgTools button,.imgTools select{padding:4px 6px;font-size:12px}.imgTools #imgSize{min-width:38px;text-align:center;font-size:12px;font-weight:700}.imgTools.hidden{display:none}
@media(max-width:900px){.layout{grid-template-columns:1fr}.paper,#preview{width:100%;padding:60px}}

<style>
#editor table,#preview table{border-collapse:collapse;width:100%;margin:14px 0;table-layout:fixed}
#editor td,#editor th,#preview td,#preview th{border:1px solid #9da5af;padding:8px;min-width:50px;vertical-align:top;overflow-wrap:anywhere}
#editor th,#preview th{font-weight:700;background:#eef3fa}
#editor table.selectedTable{outline:3px solid #3478df;outline-offset:2px}
.templateHint{font-size:12px;color:#666}
@media print{
 body{background:#fff}.toolbar{display:none}.layout{display:block;padding:0}.panel:first-child{display:none}.panel{border:0}.preview-area{padding:0!important}
}
</style>
</style>
</head>
<body>
<div class="toolbar">
<span class="title">📝 Notes Maker</span>
<div class="imgTools" id="imgTools">
 <span class="imgToolsTitle">🖼 Image Tools</span>
 <button type="button" onclick="imageResize(-10)" title="Smaller">−</button>
 <span id="imgSize">100%</span>
 <button type="button" onclick="imageResize(10)" title="Larger">＋</button>
 <select id="imgWidth" title="Image width"><option value="">Width</option><option value="25">25%</option><option value="50">50%</option><option value="75">75%</option><option value="100">100%</option></select>
 <button type="button" onclick="imageAlign('left')">⇤ Left</button>
 <button type="button" onclick="imageAlign('center')">↔ Center</button>
 <button type="button" onclick="imageAlign('right')">⇥ Right</button>
 <select id="imgSpace" title="Image spacing"><option value="">Spacing</option><option value="4">4px</option><option value="8">8px</option><option value="12">12px</option><option value="18">18px</option><option value="24">24px</option><option value="32">32px</option></select>
 <button type="button" onclick="deleteSelectedImage()">🗑 Delete Image</button>
</div>
<select id="font"><option>Noto Sans Telugu</option><option>Noto Serif Telugu</option><option>Arial</option><option>Georgia</option></select>
<select id="size"><option>12</option><option>14</option><option selected>16</option><option>18</option><option>20</option><option>24</option><option>28</option><option>32</option></select>
<button onclick="format('bold')"><b>B</b></button><button onclick="format('italic')"><i>I</i></button><button onclick="format('underline')"><u>U</u></button>
<button onclick="format('insertUnorderedList')">• Bullets</button><button onclick="format('insertOrderedList')">1. Number</button>
<button onclick="format('undo')">↶ Undo</button><button onclick="format('redo')">↷ Redo</button>
<button onclick="copyAll()">📋 Copy Image</button>
<select id="templateSelect" title="Templates">
 <option value="">📄 Templates</option>
 <option value="blank">Blank</option>
 <option value="birthday">🎂 Birthday</option>
 <option value="marriage">💍 Marriage Day</option>
 <option value="congrats">🎉 Congratulations</option>
 <option value="bullets">• Bullet Notes</option>
 <option value="exam">📚 Exam Notes</option>
 <option value="table">📊 Table Notes</option>
</select>
<button onclick="applyTemplate()">Insert Template</button>
<select id="tableMenu" title="Table Tools">
 <option value="">📊 Table Tools</option>
 <option value="2x2">2 × 2 Table</option>
 <option value="3x3">3 × 3 Table</option>
 <option value="4x4">4 × 4 Table</option>
 <option value="2x4">2 × 4 Table</option>
 <option value="4x2">4 × 2 Table</option>
</select>
<button onclick="insertSelectedTable()">Insert Table</button>
<button onclick="addTableRow()">＋ Row</button>
<button onclick="removeTableRow()">− Row</button>
<button onclick="addTableCol()">＋ Column</button>
<button onclick="removeTableCol()">− Column</button>
<button onclick="deleteTable()">🗑 Table</button>
<button onclick="format('justifyFull')">↔ Justify</button>
<button onclick="format('outdent')">⇤</button><button onclick="format('indent')">⇥</button>
<button onclick="format('superscript')">x²</button><button onclick="format('subscript')">x₂</button>
<button onclick="insertLink()">🔗 Link</button><button onclick="format('removeFormat')">Clear</button>
<select id="orientation" title="Page orientation" onchange="setOrientation(this.value)">
 <option value="portrait">📄 Portrait</option>
 <option value="landscape">▱ Landscape</option>
</select>
<select id="autoFit" title="Auto fit">
 <option value="">📐 Auto Fit</option>
 <option value="page">Fit to Page Width</option>
 <option value="images">Fit Images to Page</option>
 <option value="content">Compact Content</option>
</select>
<button onclick="applyAutoFit()">Apply Fit</button>
<button onclick="togglePrint()">🖨 Print</button>
<span class="msg" id="status">Ready</span>
</div>

<div class="layout">
<section class="panel"><div class="head">✏️ Editor</div><div class="area"><div class="paper"><div id="editor" contenteditable="true"></div></div></div></section>
<section class="panel"><div class="head">👁 LIVE PREVIEW</div><div class="area"><div id="preview"></div></div></section>
</div>

<script>
const E=document.getElementById('editor'),P=document.getElementById('preview'),S=document.getElementById('status');
let savedRange=null;
function saveRange(){const s=getSelection();if(s&&s.rangeCount&&E.contains(s.anchorNode))savedRange=s.getRangeAt(0).cloneRange()}
function restoreRange(){E.focus();if(savedRange){const s=getSelection();s.removeAllRanges();s.addRange(savedRange)}}
function format(cmd,val=null){restoreRange();document.execCommand(cmd,false,val);saveRange();update()}
document.getElementById('font').onchange=e=>format('fontName',e.target.value);
document.getElementById('size').onchange=e=>format('fontSize',e.target.value==='12'?'2':e.target.value==='14'?'3':e.target.value==='16'?'4':e.target.value==='18'?'5':e.target.value==='20'?'5':e.target.value==='24'?'6':'7');

E.addEventListener('keyup',()=>{saveRange();update()});E.addEventListener('mouseup',saveRange);E.addEventListener('input',update);

E.addEventListener('paste',async function(e){
 const items=[...e.clipboardData.items];
 const imageItems=items.filter(x=>x.kind==='file' && x.type.startsWith('image/'));
 if(!imageItems.length)return;
 e.preventDefault();
 restoreRange();
 for(const item of imageItems){
   const file=item.getAsFile(); if(!file) continue;
   const data=await new Promise((resolve,reject)=>{
     const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file);
   });
   const block=document.createElement('div');block.className='imgBlock';
   const img=document.createElement('img');img.src=data;img.alt='Pasted image';img.dataset.width='100';block.appendChild(img);
   const after=document.createElement('div');after.innerHTML='<br>';
   const r=document.createRange();const sel=getSelection();
   if(sel&&sel.rangeCount){r.setStart(sel.anchorNode,sel.anchorOffset);r.collapse(true)}else{r.selectNodeContents(E);r.collapse(false)}
   r.insertNode(block);
   r.setStartAfter(block);r.collapse(true);
   const s=getSelection();s.removeAllRanges();s.addRange(r);
   await new Promise(res=>{if(img.complete)res();else img.onload=res});
   // Put an actual editable paragraph after every image.
   const p=document.createElement('div');p.className='block';p.innerHTML='<br>';
   r.setStartAfter(block);r.collapse(true);r.insertNode(p);
   r.setStart(p,0);r.collapse(true);s.removeAllRanges();s.addRange(r);
 }
 saveRange();update();S.textContent=imageItems.length+' image(s) pasted';
});

E.addEventListener('click',e=>{
 if(e.target.tagName==='IMG'){E.querySelectorAll('img').forEach(x=>x.classList.remove('selected'));e.target.classList.add('selected');}
 else E.querySelectorAll('img.selected').forEach(x=>x.classList.remove('selected'));
});
function update(){
 P.innerHTML='';
 const c=E.cloneNode(true);
 c.querySelectorAll('.selected').forEach(x=>x.classList.remove('selected'));
 P.appendChild(c);
}
async function loadLib(){
 if(window.html2canvas)return;
 const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
 document.head.appendChild(s);await new Promise((ok,no)=>{s.onload=ok;s.onerror=no});
}
async function copyAll(){
 try{
  S.textContent='Preparing all content…';
  await loadLib();await document.fonts.ready;
  const box=document.createElement('div');
  box.style.cssText='position:fixed;left:-100000px;top:0;width:'+E.clientWidth+'px;background:transparent;padding:0;margin:0';
  const c=E.cloneNode(true);c.querySelectorAll('.selected').forEach(x=>x.classList.remove('selected'));
  c.style.cssText='display:block;width:100%;height:auto;min-height:0;padding:0;margin:0;background:transparent';
  box.appendChild(c);document.body.appendChild(box);
  await Promise.all([...box.querySelectorAll('img')].map(img=>img.complete?Promise.resolve():new Promise(r=>{img.onload=r;img.onerror=r})));
  const canvas=await html2canvas(box,{backgroundColor:null,scale:2,useCORS:true,allowTaint:true,logging:false});
  box.remove();
  const blob=await new Promise(r=>canvas.toBlob(r,'image/png'));
  if(navigator.clipboard&&window.ClipboardItem&&window.isSecureContext){
    await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);
    S.textContent='All text + images copied as ONE image.';
  }else{
    const u=URL.createObjectURL(blob);window.open(u,'_blank');S.textContent='Complete image opened — use Copy from the image tab.';
  }
 }catch(err){console.error(err);S.textContent='Copy failed: '+err.message;alert('Copy Image failed. See the status bar.')}
}
document.addEventListener('keydown',e=>{
 if(!(e.ctrlKey||e.metaKey))return;const k=e.key.toLowerCase();
 if(['b','i','u','z','y'].includes(k)){e.preventDefault();format(k==='b'?'bold':k==='i'?'italic':k==='u'?'underline':k==='z'?'undo':'redo')}
});

// ---------- Word-style features, templates and table tools ----------
window.insertLink=function(){
  restoreRange();
  const url=prompt("Enter URL:");
  if(url) document.execCommand("createLink",false,url);
  saveRange(); update();
};

window.applyTemplate=function(){
  const v=document.getElementById('templateSelect').value;
  if(!v)return;
  const templates={
    blank:"",
    birthday:"<h1 style='text-align:center'>🎂 Happy Birthday!</h1><p style='text-align:center'>Wishing you a wonderful birthday filled with happiness, health and success.</p><p><br></p>",
    marriage:"<h1 style='text-align:center'>💍 Happy Marriage Day</h1><p style='text-align:center'>Wishing you both a lifetime of love, togetherness and beautiful memories.</p><p><br></p>",
    congrats:"<h1 style='text-align:center'>🎉 Congratulations!</h1><p style='text-align:center'>Congratulations on your wonderful achievement. Wishing you continued success.</p><p><br></p>",
    bullets:"<h2>Key Notes</h2><ul><li>Important point</li><li>Supporting point</li><li>Conclusion / takeaway</li></ul><p><br></p>",
    exam:"<h1>Exam Notes</h1><h3>Topic</h3><ul><li>Definition</li><li>Key features</li><li>Examples</li><li>Important facts</li></ul><h3>Quick Revision</h3><p><br></p>",
    table:"<h2>Table Notes</h2><table><thead><tr><th>Topic</th><th>Details</th></tr></thead><tbody><tr><td>Point 1</td><td>Write details here</td></tr><tr><td>Point 2</td><td>Write details here</td></tr></tbody></table><p><br></p>"
  };
  if(!confirm("Insert this template? Existing editor content will be replaced."))return;
  E.innerHTML=templates[v]||"";
  saveRange();update();
};

function selectedTable(){
  const s=getSelection();
  let n=s&&s.rangeCount?s.anchorNode:null;
  while(n&&n!==E){
    if(n.nodeType===1&&n.tagName==='TABLE')return n;
    n=n.parentNode;
  }
  return E.querySelector('table.selectedTable');
}
window.insertSelectedTable=function(){
  const v=document.getElementById('tableMenu').value;
  if(!v)return;
  const [r,c]=v.split('x').map(Number);
  restoreRange();
  let table=document.createElement('table');
  let tbody=document.createElement('tbody');
  for(let i=0;i<r;i++){
    const tr=document.createElement('tr');
    for(let j=0;j<c;j++){
      const cell=document.createElement(i===0?'th':'td');
      cell.textContent=i===0?'Header '+(j+1):'';
      tr.appendChild(cell);
    }
    tbody.appendChild(tr);
  }
  table.appendChild(tbody);
  const range=getSelection().rangeCount?getSelection().getRangeAt(0):document.createRange();
  range.collapse(false);range.insertNode(table);
  const p=document.createElement('div');p.innerHTML='<br>';
  table.after(p);
  const nr=document.createRange();nr.setStart(p,0);nr.collapse(true);
  const s=getSelection();s.removeAllRanges();s.addRange(nr);
  saveRange();update();
};

function currentRowCell(){
  const s=getSelection();let n=s&&s.rangeCount?s.anchorNode:null;
  while(n&&n!==E){
    if(n.nodeType===1&&(n.tagName==='TD'||n.tagName==='TH'))return n;
    n=n.parentNode;
  }
  return null;
}
window.addTableRow=function(){
  const cell=currentRowCell(); if(!cell)return alert("Place the cursor inside a table first.");
  const table=cell.closest('table'),row=cell.parentElement, nr=row.cloneNode(true);
  [...nr.cells].forEach(x=>x.innerHTML='');
  row.after(nr);update();
};
window.removeTableRow=function(){
  const cell=currentRowCell(); if(!cell)return alert("Place the cursor inside a table first.");
  const row=cell.parentElement,table=cell.closest('table');
  if(table.rows.length<=1)return;
  row.remove();update();
};
window.addTableCol=function(){
  const cell=currentRowCell(); if(!cell)return alert("Place the cursor inside a table first.");
  const table=cell.closest('table'),idx=cell.cellIndex;
  [...table.rows].forEach((r,i)=>{
    const c=document.createElement(i===0?'th':'td');c.innerHTML='';
    r.insertBefore(c,r.cells[idx+1]||null);
  });update();
};
window.removeTableCol=function(){
  const cell=currentRowCell(); if(!cell)return alert("Place the cursor inside a table first.");
  const table=cell.closest('table'); if(table.rows[0].cells.length<=1)return;
  [...table.rows].forEach(r=>r.deleteCell(cell.cellIndex));update();
};
window.deleteTable=function(){
  const t=selectedTable();if(!t)return alert("Place the cursor inside a table first.");
  t.remove();update();
};
E.addEventListener('click',e=>{
  E.querySelectorAll('table.selectedTable').forEach(t=>t.classList.remove('selectedTable'));
  const t=e.target.closest&&e.target.closest('table');
  if(t)t.classList.add('selectedTable');
});
window.togglePrint=function(){window.print()};


// ---------- Page orientation & Auto Fit ----------
let pageOrientation='portrait';
function setOrientation(mode){
  pageOrientation=mode==='landscape'?'landscape':'portrait';
  const w=pageOrientation==='landscape'?1123:794;
  const h=pageOrientation==='landscape'?794:1123;
  document.querySelectorAll('.paper,#preview').forEach(x=>{
    x.style.width=w+'px'; x.style.minHeight=h+'px';
    x.dataset.orientation=pageOrientation;
  });
  // Keep the editing area usable on screen while preserving the page ratio.
  E.style.minHeight=Math.max(300,h-144)+'px';
  update();
  S.textContent='Orientation: '+(pageOrientation==='landscape'?'Landscape':'Portrait');
}
function applyAutoFit(){
  const mode=document.getElementById('autoFit').value;
  if(!mode)return;
  const pageW=pageOrientation==='landscape'?1123:794;
  const pad=72; const avail=pageW-pad*2;
  if(mode==='images'||mode==='page'){
    E.querySelectorAll('.imgBlock img').forEach(img=>{
      img.style.maxWidth='100%';
      const natural=img.naturalWidth||0;
      if(natural && natural>avail){img.style.width='100%';img.dataset.width='100';}
    });
  }
  if(mode==='content'){
    E.querySelectorAll('.imgBlock').forEach(b=>b.style.marginTop='8px');
    E.querySelectorAll('.imgBlock').forEach(b=>b.style.marginBottom='8px');
    E.style.lineHeight='1.35';
  }else{
    E.style.lineHeight='1.55';
  }
  update();
  S.textContent='Auto Fit applied: '+document.getElementById('autoFit').selectedOptions[0].text;
}
setOrientation('portrait');

// ---------- Image resize & layout tools ----------
let selectedImage=null;
function syncImageTools(img){
  selectedImage=img||null;
  const tools=document.getElementById('imgTools');
  if(!img){ tools.classList.add('hidden'); return; }
  tools.classList.remove('hidden');
  const w=parseFloat(img.dataset.width||'100');
  document.getElementById('imgSize').textContent=Math.round(w)+'%';
  document.getElementById('imgWidth').value='';
  document.getElementById('imgSpace').value='';
}
function setImageWidth(w){
  if(!selectedImage)return alert('Click an image first.');
  w=Math.max(10,Math.min(100,Number(w)||100));
  selectedImage.style.width=w+'%'; selectedImage.style.height='auto'; selectedImage.dataset.width=w;
  update(); syncImageTools(selectedImage);
}
function imageResize(delta){
  if(!selectedImage)return alert('Click an image first.');
  setImageWidth(parseFloat(selectedImage.dataset.width||'100')+delta);
}
function imageAlign(a){
  if(!selectedImage)return alert('Click an image first.');
  const block=selectedImage.closest('.imgBlock'); if(!block)return;
  block.style.textAlign=a; update(); syncImageTools(selectedImage);
}
function imageSpacing(px){
  if(!selectedImage)return alert('Click an image first.');
  const block=selectedImage.closest('.imgBlock'); if(!block)return;
  block.style.marginTop=px+'px'; block.style.marginBottom=px+'px'; update(); syncImageTools(selectedImage);
}
function deleteSelectedImage(){
  if(!selectedImage)return alert('Click an image first.');
  const block=selectedImage.closest('.imgBlock');
  if(block) block.remove(); else selectedImage.remove();
  selectedImage=null; syncImageTools(null); update(); S.textContent='Image deleted';
}
E.addEventListener('click',e=>{
  if(e.target.tagName==='IMG') syncImageTools(e.target); else if(!e.target.closest('#imgTools')) syncImageTools(null);
});
document.getElementById('imgWidth').addEventListener('change',e=>{if(e.target.value)setImageWidth(e.target.value)});
document.getElementById('imgSpace').addEventListener('change',e=>{if(e.target.value)imageSpacing(e.target.value)});
syncImageTools(null);

update();
</script>
</body>
</html>
